<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tray Table">
<meta name="theme-color" content="#f6f8ff">
<title>Tray Table (v0)</title>
<style>
:root{
  --bg:#f6f8ff; --fg:#1e1b3a; --muted:#6f6c8a; --card:#ffffff; --edge:rgba(30,27,58,.08);
  --accent:#2f6fed; --ring:#ffc83d; --ok:#19b38a; --danger:#d93d5c;
  --shadow:0 12px 30px rgba(47,60,120,.14);
  --chip:#e9edfb; --chip-on:#1e1b3a; --chip-on-fg:#ffffff;
  --domain-bg:var(--bg);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a2e; --fg:#f2f3ff; --muted:#a3a7c7; --card:#262d4a; --edge:rgba(255,255,255,.09);
    --shadow:0 12px 30px rgba(0,0,0,.5); --chip:#262d4a; --chip-on:#f2f3ff; --chip-on-fg:#141a2e;
  }
}
:root[data-theme="dark"]{
  --bg:#141a2e; --fg:#f2f3ff; --muted:#a3a7c7; --card:#262d4a; --edge:rgba(255,255,255,.09);
  --shadow:0 12px 30px rgba(0,0,0,.5); --chip:#262d4a; --chip-on:#f2f3ff; --chip-on-fg:#141a2e;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;width:100%;background:var(--domain-bg);transition:background-color .6s ease}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
#timebar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(127,127,160,.2);z-index:6}
#timefill{height:100%;width:0%;background:var(--accent);transition:width 1s linear}
#gate{position:absolute;top:0;right:0;width:88px;height:88px;z-index:8;touch-action:none}

/* ---- play ---- */
#screen-play{padding:16px 14px 12px}
#cue{flex:0 0 34%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;container-type:size}
.cue-item .item{font-size:min(24vh,28vw);font-size:76cqmin}
.cue-q{width:min(22vh,24vw);height:min(22vh,24vw);border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:min(11vh,12vw);line-height:1}
#choices{flex:1 1 0;min-height:0;display:grid;gap:14px;margin-top:12px}
.card{position:relative;background:var(--card);border-radius:30px;box-shadow:var(--shadow);border:3px solid var(--edge);
  display:flex;align-items:center;justify-content:center;cursor:pointer;container-type:size;overflow:hidden;transition:opacity .3s}
.card .item{font-size:min(20vh,22vw);font-size:62cqmin}
.card.span2{grid-column:span 2}
.card.dim{opacity:.28}
.card.shake{animation:shake .45s ease}
.card.pop{animation:pop .5s ease}
.card.wiggle{animation:wobble .8s ease}
.card.hint{animation:wobble 1s ease-in-out infinite;box-shadow:0 0 0 8px var(--ring),var(--shadow)}
.key{position:absolute;top:8px;left:13px;font-size:15px;color:var(--muted);opacity:.6;font-weight:700}
.item{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.swatch{display:block;width:.95em;height:.95em;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;
  box-shadow:inset -.04em -.06em 0 rgba(0,0,0,.14),0 0 0 .03em var(--edge)}
.shape{width:1em;height:1em;display:block;fill:#6a5cff}
.num{flex-direction:column;gap:.1em}
.num .numeral{font-weight:800;font-size:1em}
.num .dots{font-size:.26em;letter-spacing:.12em;width:3.2em;line-height:1.15;text-align:center;word-break:break-all}
.letter{font-weight:800}
.card.pad{flex-direction:column;gap:2cqmin}
.count-big{font-size:min(22vh,24vw);font-size:54cqmin;font-weight:800;line-height:1;min-height:1em;display:flex;align-items:center;justify-content:center}
.count-big .n{animation:pop .4s ease;display:inline-block}
.count-big .hand{font-size:.55em}
.count-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.08em;font-size:min(7vh,8vw);font-size:13cqmin;line-height:1;padding:0 4cqmin;max-width:100%}
.count-row span{animation:pop .4s ease;display:inline-block}
#celebrate .big{display:flex;flex-direction:column;align-items:center}
.celebrate-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.1em;font-size:min(7vh,9vw);line-height:1;margin-top:10px;max-width:90vw}

/* ---- celebrate ---- */
#celebrate{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #celebrate{background:rgba(14,18,36,.62)} }
:root[data-theme="dark"] #celebrate{background:rgba(14,18,36,.62)}
#celebrate .big .item{font-size:min(46vh,56vw)}
#celebrate .big{animation:pop .6s ease}
#celebrate .label{font-size:min(6vh,9vw);font-weight:800;margin-top:10px;text-transform:capitalize}
#celebrate i{position:absolute;left:50%;top:50%;width:14px;height:10px;border-radius:3px;animation:confetti .95s ease-out forwards}

/* ---- break ---- */
#screen-break{align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#break-emoji{font-size:min(40vh,50vw);animation:bounce 1s ease-in-out infinite;line-height:1}
#break-text{font-size:min(5vh,8vw);font-weight:800}

/* ---- calm ---- */
#screen-calm{overflow:hidden}
#bubbles{position:absolute;inset:0}
.bubble{position:absolute;bottom:-25vh;animation:rise linear forwards}
.bubble>i{display:block;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(190,215,255,.45) 55%,rgba(130,170,255,.2));
  box-shadow:inset 0 0 18px rgba(255,255,255,.65),0 6px 18px rgba(80,120,200,.15);transition:transform .3s ease,opacity .3s ease}
.bubble.popped>i{transform:scale(1.6);opacity:0}
#calm-text{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:var(--muted);font-weight:700;font-size:16px}

/* ---- done ---- */
#screen-done{align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#done-emoji{font-size:min(40vh,50vw);line-height:1;animation:wobble 1.6s ease-in-out infinite}
#screen-done h1{font-size:min(6vh,9vw);margin:0}

/* ---- grown-up panel ---- */
#screen-parent{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:24px 18px 48px;z-index:7}
.panel{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel h1{font-size:30px;margin:0;letter-spacing:-.02em}
.panel h1 small{font-weight:600;color:var(--muted);font-size:15px;margin-left:6px}
.panel .sub{color:var(--muted);margin:4px 0 0;font-size:15px;line-height:1.45}
.panel h2{font-size:16px;margin:0 0 10px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button,.chip,.btn{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:transparent;color:var(--fg);font-weight:700;cursor:pointer}
.seg button:focus-visible,.chip:focus-visible,.btn:focus-visible,.ladder button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.seg button.on,.chip.on{background:var(--chip-on);color:var(--chip-on-fg)}
.chip{background:var(--chip);text-align:left}
.chip .lvl{display:block;font-size:11px;font-weight:600;opacity:.75}
.btn{background:var(--chip)}
.btn.primary{background:var(--accent);color:#fff;font-size:19px;padding:15px 24px;border-radius:16px}
.btn.danger{color:var(--danger)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
dl.stats dt{color:var(--muted)}
dl.stats dd{margin:0;font-weight:700}
.dom{padding:12px 0;border-top:1px solid var(--edge)}
.dom:last-child{border-bottom:1px solid var(--edge)}
.dom-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dom-head span{font-size:13px;color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ladder button{font:inherit;font-size:12px;font-weight:700;border:0;background:var(--chip);color:var(--fg);padding:6px 9px;border-radius:9px;cursor:pointer}
.ladder button.cur{background:var(--ok);color:#fff}
.ladder button.locked{opacity:.4}
.ladder i{color:var(--muted);font-style:normal}
.tips{font-size:13px;color:var(--muted);line-height:1.55}
.tips code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}

@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-140vh)}}
@keyframes confetti{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes peekIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.bounce{animation:bounce .9s ease-in-out infinite}
.pulse{animation:pulse 1.4s ease-in-out infinite}
.peek{animation:peekIn .3s ease}
@media (prefers-reduced-motion:reduce){
  .bounce,.pulse,#done-emoji,#break-emoji{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="timebar"><div id="timefill"></div></div>
  <div id="gate" class="hidden" aria-hidden="true"></div>

  <section id="screen-parent" class="screen"><div class="panel" id="panel"></div></section>

  <section id="screen-play" class="screen hidden">
    <div id="cue"></div>
    <div id="choices"></div>
  </section>

  <section id="screen-break" class="screen hidden">
    <div id="break-emoji">👃</div>
    <div id="break-text">Touch your nose!</div>
  </section>

  <section id="screen-calm" class="screen hidden">
    <div id="bubbles"></div>
    <div id="calm-text">nice and slow</div>
  </section>

  <section id="screen-done" class="screen hidden">
    <div id="done-emoji">👋</div>
    <h1>All done!</h1>
    <button class="btn" id="done-parent">Grown-up panel</button>
  </section>

  <div id="celebrate" class="hidden"></div>
</div>

<script>
/*
  Tray Table v0 — a single-file toddler game for planes, restaurants and big feelings.
  Sections: CONFIG · CONTENT · STATE · ENGINE (score-driven paths) · RUNTIME (session machine) · UI · INPUT
  Content is data (the RAW block). Tuning is data (the CFG block). Everything stays on the device.
*/
(() => {
'use strict';

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const now = () => Date.now();
const fmt = ms => { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return m + ':' + String(s).padStart(2, '0'); };

/* ================= CONFIG ================= */
const CFG = {
  BLOCK_MS: 75000,        // one category block
  CALM_MS: 60000,         // bubbles at the end of every session
  MIN_BLOCK_MS: 15000,    // don't start a block shorter than this; go to calm instead
  BREAK_EVERY: 3,         // wiggle break after this many blocks
  BREAK_STEP_MS: 10000,   // seconds per wiggle prompt
  PEEK_MS: 1600,          // how long the target shows in "Peek & find"
  CELEBRATE_MS: 1500,
  IDLE_MS: 12000,         // no tap → re-prompt
  POKE_MS: 18000,         // still nothing → short explore burst
  POKE_LEN_MS: 20000,
  RESHUFFLE_MS: 25000,    // explore deals a new set
  PROMOTE_N: 8, PROMOTE_ACC: 0.8,   // 80% clean first taps over the last 8 → next step
  DEMOTE_N: 6, DEMOTE_ACC: 0.5,     // under 50% over the last 6 → step back
  EXPLORE_TAPS: 12, EXPLORE_RATIO: 0.7, // leave Explore once 70% of 12+ taps land on things
  REVIEW_P: 0.15,         // share of trials run one step easier (confidence, not scored)
  MISS_STREAK: 3, SUPPORT_TRIALS: 2,  // 3 misses in a row → 2 can't-miss trials
  SPAM_TAPS: 6, SPAM_WINDOW_MS: 2000  // mashing → explore burst
};
const CHEERS = ['Yes!', 'You found it!', 'Hooray!', 'Wow!', "That's it!"];
const WIGGLES = [['👃', 'Touch your nose!'], ['👏', 'Clap, clap, clap!'], ['🙌', 'Arms up high!'], ['👋', 'Wiggle your fingers!'],
  ['👂', 'Touch your ears!'], ['😮', 'Make a big O mouth!'], ['🤗', 'Big squeeze hug!'], ['🤲', 'Pat your knees!']];
const LEVELS = [
  { id: 0, name: 'Explore',     choices: 4, mode: 'explore' },   // tap anything, it reacts
  { id: 1, name: 'Match 2',     choices: 2, cue: 'shown', mode: 'find' },  // target stays visible, pick the same one
  { id: 2, name: 'Peek & find', choices: 2, cue: 'peek',  mode: 'find' },  // target flashes, then hides
  { id: 3, name: 'Find 3',      choices: 3, cue: 'ask',   mode: 'find' },  // spoken only (peek when silent)
  { id: 4, name: 'Find 4',      choices: 4, cue: 'ask',   mode: 'find' }
];
// Counting has its own ladder: a number flashes, every tap counts up out loud, the round ends at the target.
const COUNT_LADDER = [
  { id: 0, name: 'Up to 3',  mode: 'count', min: 1, max: 3 },
  { id: 1, name: 'Up to 6',  mode: 'count', min: 2, max: 6 },
  { id: 2, name: 'Up to 10', mode: 'count', min: 3, max: 10 }
];
const NUMWORDS = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const COUNT_OBJECTS = [['duck', '🦆', 'ducks'], ['star', '⭐', 'stars'], ['apple', '🍎', 'apples'], ['car', '🚗', 'cars'], ['balloon', '🎈', 'balloons'],
  ['fish', '🐟', 'fish'], ['cookie', '🍪', 'cookies'], ['frog', '🐸', 'frogs'], ['flower', '🌼', 'flowers'], ['bus', '🚌', 'buses']];

/* ================= CONTENT ================= */
const SHAPES = {
  circle: '<circle cx="50" cy="50" r="42"/>',
  square: '<rect x="9" y="9" width="82" height="82" rx="12"/>',
  triangle: '<path d="M50 7 L95 89 L5 89 Z"/>',
  star: '<path d="M50 5 L61.5 37.5 L95.5 37.5 L68 57.5 L78.5 91 L50 71 L21.5 91 L32 57.5 L4.5 37.5 L38.5 37.5 Z"/>',
  heart: '<path d="M50 91 L15 56 C-2 39 10 11 32 11 C42 11 48 18 50 24 C52 18 58 11 68 11 C90 11 102 39 85 56 Z"/>',
  diamond: '<path d="M50 4 L94 50 L50 96 L6 50 Z"/>'
};
// [name, emoji/value, sound word]. Order matters: the first four of each are the opening set.
const RAW = {
  animals: { name: 'Animals', kind: 'emoji', role: 'concrete', bg: ['#e4f5df', '#1c2d21'], items: [
    ['cow', '🐄', 'Moo!'], ['dog', '🐶', 'Woof woof!'], ['cat', '🐱', 'Meow!'], ['duck', '🦆', 'Quack!'],
    ['pig', '🐷', 'Oink oink!'], ['sheep', '🐑', 'Baa!'], ['lion', '🦁', 'Roar!'], ['frog', '🐸', 'Ribbit!'],
    ['horse', '🐴', 'Neigh!'], ['chicken', '🐔', 'Cluck cluck!'], ['elephant', '🐘', 'Toot!'], ['monkey', '🐵', 'Ooh ooh ah ah!'],
    ['fish', '🐟', 'Blub blub!'], ['bunny', '🐰', 'Hop hop!'], ['bear', '🐻', 'Grr!'], ['owl', '🦉', 'Hoo hoo!']] },
  vehicles: { name: 'Things that go', kind: 'emoji', role: 'concrete', bg: ['#dfeafc', '#1b2538'], items: [
    ['car', '🚗', 'Vroom!'], ['bus', '🚌', 'Beep beep!'], ['train', '🚂', 'Choo choo!'], ['airplane', '✈️', 'Whoosh!'],
    ['boat', '⛵', 'Splash!'], ['bike', '🚲', 'Ring ring!'], ['truck', '🚚', 'Honk honk!'], ['fire truck', '🚒', 'Wee-oo wee-oo!'],
    ['tractor', '🚜', 'Chug chug!'], ['helicopter', '🚁', 'Whirr whirr!'], ['rocket', '🚀', 'Blast off!']] },
  food: { name: 'Food', kind: 'emoji', role: 'concrete', bg: ['#fdebdc', '#33261e'], items: [
    ['apple', '🍎', 'Crunch!'], ['banana', '🍌', 'Yum yum!'], ['cookie', '🍪', 'Mmm!'], ['carrot', '🥕', 'Crunch crunch!'],
    ['strawberry', '🍓', 'Yummy!'], ['cheese', '🧀', 'Mmm!'], ['egg', '🥚', 'Crack!'], ['bread', '🍞', 'Yum!'],
    ['milk', '🥛', 'Glug glug!'], ['grapes', '🍇', 'Pop pop!'], ['pizza', '🍕', 'Yum yum!'], ['watermelon', '🍉', 'Slurp!']] },
  body: { name: 'My body', kind: 'emoji', role: 'concrete', bg: ['#fde3ec', '#33202a'], items: [
    ['nose', '👃', 'Beep beep!'], ['hand', '✋', 'High five!'], ['ear', '👂', 'Listen!'], ['mouth', '👄', 'Mwah!'],
    ['foot', '🦶', 'Wiggle wiggle!'], ['eye', '👁️', 'Blink blink!'], ['tooth', '🦷', 'Brush brush!']] },
  colors: { name: 'Colors', kind: 'swatch', role: 'visual', bg: ['#eee6fb', '#2a2140'], items: [
    ['red', '#e63946'], ['blue', '#2a6fdb'], ['yellow', '#ffd23f'], ['green', '#3fb950'],
    ['orange', '#ff8c42'], ['purple', '#8e5bd9'], ['pink', '#ff7bac'], ['black', '#1f1f24']] },
  shapes: { name: 'Shapes', kind: 'shape', role: 'visual', bg: ['#fff3cc', '#332d1a'], items: [
    ['circle', 'circle'], ['square', 'square'], ['triangle', 'triangle'], ['star', 'star'], ['heart', 'heart'], ['diamond', 'diamond']] },
  numbers: { name: 'Numbers', kind: 'number', role: 'abstract', bg: ['#dcf5ee', '#1a2e2a'], items: [
    ['one', 1], ['two', 2], ['three', 3], ['four', 4], ['five', 5]] },
  letters: { name: 'Letters', kind: 'letter', role: 'abstract', bg: ['#ebe6fb', '#26203a'], items: [
    ['A', 'A'], ['B', 'B'], ['O', 'O'], ['C', 'C'], ['M', 'M'], ['S', 'S'], ['D', 'D'], ['E', 'E']] },
  counting: { name: 'Counting', kind: 'count', role: 'skill', ladder: COUNT_LADDER, bg: ['#ddf3fb', '#17303a'], items: [
    ['one', 1], ['two', 2], ['three', 3], ['four', 4], ['five', 5], ['six', 6], ['seven', 7], ['eight', 8], ['nine', 9], ['ten', 10]] }
};
const ladder = d => DOMAINS[d].ladder || LEVELS;
const DOMAINS = {}, ITEMS = {};
for (const d of Object.keys(RAW)) {
  const def = RAW[d]; DOMAINS[d] = def;
  ITEMS[d] = def.items.map(([name, val, say]) => ({
    id: d + ':' + name, dom: d, name, val, say: say || '',
    label: def.kind === 'letter' ? 'letter ' + name : def.kind === 'swatch' ? name + ' one' : def.kind === 'number' ? 'number ' + name : name
  }));
}
function renderItem(it) {
  const k = DOMAINS[it.dom].kind;
  if (k === 'emoji')  return `<span class="item">${it.val}</span>`;
  if (k === 'swatch') return `<span class="item"><span class="swatch" style="background:${it.val}"></span></span>`;
  if (k === 'shape')  return `<span class="item"><svg class="shape" viewBox="0 0 100 100" aria-hidden="true">${SHAPES[it.val]}</svg></span>`;
  if (k === 'number' || k === 'count') return `<span class="item num"><span class="numeral">${it.val}</span><span class="dots">${'●'.repeat(it.val)}</span></span>`;
  return `<span class="item letter">${it.val}</span>`;
}

/* ================= STATE ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ minutes: 10, sound: true, domains: ['animals', 'vehicles', 'food'] }, store.get('tt.settings', {}));
settings.domains = (settings.domains || []).filter(d => RAW[d]);
if (!settings.v || settings.v < 2) { if (!settings.domains.includes('counting')) settings.domains.push('counting'); settings.v = 2; }
let progress = store.get('tt.progress', null);
if (!progress || !progress.domains) progress = { domains: {}, sessions: 0 };

  if (S.tapTimes.length >= CFG.SPAM_TAPS) {
    S.tapTimes = []; S.stats.spam++;
    renderExplore({ until: Math.min(now() + CFG.POKE_LEN_MS, S.blockEndsAt), then: runTrial, poke: true });
    return true;
  }
  return false;
}
function renderExplore(o) {
  T.clearAll(); clearIdle(); hideCelebrate();
  S.phase = 'explore'; S.trial = null; show('play');
  S.explore = { until: o.until, then: o.then, poke: !!o.poke, taps: 0, choices: [] };
  $('#cue').innerHTML = `<div class="cue-q pulse">✨</div>`;
  dealExplore();
  TTS.say(rand(['Tap, tap!', 'What do you see?', 'Touch one!']));
  S.exploreT = T.after(Math.max(400, o.until - now()), () => { const then = S.explore && S.explore.then; S.explore = null; (then || nextBlock)(); });
  scheduleReshuffle();
}
function scheduleReshuffle() { S.reshuffleT = T.after(CFG.RESHUFFLE_MS, () => { if (S.phase === 'explore' && S.explore) { dealExplore(); scheduleReshuffle(); } }); }
function dealExplore() { const list = shuffle(ITEMS[S.dom]).slice(0, 4); S.explore.choices = list; layoutChoices(list); }
function onExploreTap(card) {
  const ex = S.explore; if (!ex) return;
  const it = ex.choices[+card.dataset.i]; if (!it) return;
  card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  SFX.play('tap'); TTS.say(`${cap1(it.name)}. ${it.say}`);
  S.stats.exploreTaps++; ex.taps++; recordExploreTap(S.dom, true); save();
  if (ex.taps % 8 === 0) dealExplore();
  if (!ex.poke && dprog(S.dom).level > 0) {   // graduated out of Explore mid-block
    T.clear(S.exploreT); T.clear(S.reshuffleT); SFX.play('yay');
    T.after(900, () => { if (S.phase === 'explore') runTrial(); });
  }
}
function onExploreBlank() { if (S.explore) recordExploreTap(S.dom, false); }
function makeBubble() {
  const b = document.createElement('div'); b.className = 'bubble';
  const sz = 44 + Math.random() * 90;
  b.style.width = b.style.height = sz + 'px'; b.style.left = (5 + Math.random() * 85) + '%';
  b.style.animationDuration = (9 + Math.random() * 6) + 's';
  b.innerHTML = '<i></i>';
  b.addEventListener('pointerdown', () => { if (b.classList.contains('popped')) return; b.classList.add('popped'); SFX.play('pop'); setTimeout(() => b.remove(), 350); });
  b.addEventListener('animationend', () => b.remove());
  $('#bubbles').appendChild(b);
}
let tbI = null;
function timebarStart() {
  stopTimebar();
  $('#timefill').style.width = '0%';
  tbI = setInterval(() => {
    if (!S.running || S.paused) return;
    const f = Math.min(1, (now() - S.start - S.pausedTotal) / (settings.minutes * 60000));
    $('#timefill').style.width = (f * 100) + '%';
  }, 1000);
}
function stopTimebar() { if (tbI) { clearInterval(tbI); tbI = null; } }

/* ---- grown-up panel ---- */
function ladderHTML(d) {
  const p = dprog(d), cap = levelCap(d), items = ITEMS[d];
  const atL = p.hist.filter(h => h.level === p.level && !h.review).slice(-CFG.PROMOTE_N);
  const score = atL.length ? `${Math.round(100 * atL.filter(h => h.ok).length / atL.length)}% clean over the last ${atL.length}`
              : (p.level === 0 && ladder(d)[0].mode === 'explore' ? `${p.explore.on} of ${p.explore.all} taps landed on things` : 'no rounds yet');
  const known = items.filter(it => isKnown(p, it)).length;
  return `<div class="dom"><div class="dom-head"><b>${DOMAINS[d].name}</b><span>${score}, knows ${known} of ${items.length}</span></div>
    <div class="ladder">${ladder(d).map(L => `<button data-act="lvl" data-d="${d}" data-v="${L.id}" class="${L.id === p.level ? 'cur' : ''}${L.id > cap ? ' locked' : ''}">${L.name}</button>`).join('<i>›</i>')}</div></div>`;
}
function renderPanel() {
  const running = S.running, done = S.phase === 'done', st = S.stats;
  let h = `<div><h1>Tray Table<small>v0</small></h1><p class="sub">Flight-test build for an 18 to 24 month old. Nothing leaves this device.</p></div>`;
  if (st && (running || done)) {
    const elapsed = fmt((S.paused ? S.pauseAt : now()) - S.start - S.pausedTotal);
    const acc = st.trials ? Math.round(100 * st.firstOk / st.trials) + '%' : 'no trials yet';
    h += `<div><h2>${running ? 'This session, paused' : 'Last session'}</h2><dl class="stats">
      <dt>Played</dt><dd>${elapsed}</dd>
      <dt>Trials</dt><dd>${st.trials}</dd>
      <dt>Clean rounds</dt><dd>${acc}</dd>
      <dt>Hints needed</dt><dd>${st.hints}</dd>
      <dt>Idle nudges</dt><dd>${st.pokes}</dd>
      <dt>Mash resets</dt><dd>${st.spam}</dd>
      <dt>Explore taps</dt><dd>${st.exploreTaps}</dd></dl></div>`;
  }
  h += `<div class="row">` + (running
    ? `<button class="btn primary" data-act="resume">Resume</button><button class="btn" data-act="end">End session</button>`
    : `<button class="btn primary" data-act="start">${done ? 'Start again' : 'Start'}</button>`) + `</div>`;
  h += `<div><h2>How long</h2><div class="seg">${[5, 10, 15, 20, 30].map(m => `<button data-act="min" data-v="${m}" class="${settings.minutes === m ? 'on' : ''}">${m} min</button>`).join('')}</div>
    <p class="note">Ends with a minute of slow bubbles, then a clear all-done.</p></div>`;
  h += `<div><h2>Sound</h2><div class="seg"><button data-act="sound" data-v="1" class="${settings.sound ? 'on' : ''}">On</button><button data-act="sound" data-v="0" class="${!settings.sound ? 'on' : ''}">Off, silent mode</button></div>
    <p class="note">Silent mode swaps spoken prompts for a quick peek at the target, so it works muted at the table.</p></div>`;
  h += `<div><h2>Categories</h2><div class="row">${Object.keys(DOMAINS).map(d =>
    `<button class="chip ${settings.domains.includes(d) ? 'on' : ''}" data-act="dom" data-v="${d}">${DOMAINS[d].name}<span class="lvl">${ladder(d)[dprog(d).level].name}</span></button>`).join('')}</div></div>`;
  const shown = Object.keys(DOMAINS).filter(d => settings.domains.includes(d) || dprog(d).hist.length || dprog(d).level > 0);
  h += `<div><h2>Paths</h2><p class="note" style="margin:0 0 6px">Scores move each category along its own ladder. Tap a step to override. Greyed steps unlock once a concrete category gets further.</p>${shown.map(ladderHTML).join('')}</div>`;
  h += `<div class="row"><button class="btn danger" data-act="reset">${S.confirmReset ? 'Tap again to erase all progress' : 'Reset progress'}</button></div>`;
  h += `<div class="tips">Open this panel by holding the top-right corner for 1.5 seconds, or pressing <code>Esc</code>. On a keyboard, <code>←</code> <code>↑</code> <code>↓</code> <code>→</code> or <code>1</code> to <code>4</code> pick a card and <code>Space</code> repeats the prompt. On iPad, turn on Guided Access (Settings, Accessibility) and triple-click to lock the kid in.</div>`;
  $('#panel').innerHTML = h;
}

/* ================= INPUT ================= */
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'start') return startSession();
  if (act === 'resume') return resumeSession();
  if (act === 'end') { endSession(); return renderPanel(); }
  if (act === 'min') settings.minutes = +v;
  if (act === 'sound') settings.sound = v === '1';
  if (act === 'dom') { const i = settings.domains.indexOf(v); if (i >= 0) settings.domains.splice(i, 1); else settings.domains.push(v); if (S.running) S.order = shuffle(settings.domains); }
  if (act === 'lvl') { const d = b.dataset.d, p = dprog(d), lv = Math.min(+v, levelCap(d)); p.level = lv; p.hist = p.hist.filter(h => h.level !== lv); if (lv > 0) p.explore = { on: 0, all: 0 }; }
  if (act === 'reset') {
    if (S.confirmReset) { progress = { domains: {}, sessions: 0 }; S.confirmReset = false; }
    else { S.confirmReset = true; setTimeout(() => { S.confirmReset = false; if (!$('#screen-parent').classList.contains('hidden')) renderPanel(); }, 3000); }
  }
  save(); renderPanel();
});
$('#screen-play').addEventListener('pointerdown', e => {
  if (e.isPrimary === false) return;
  SFX.init(); SFX.resume();
  if (trackTap()) return;
  const card = e.target.closest('.card');
  if (S.phase === 'trial' && S.trial && S.trial.mode === 'count') { if (e.target.closest('#choices')) onPadTap(); else if (e.target.closest('#cue')) onCueTap(false); }
  else if (S.phase === 'trial') { if (card) onChoice(+card.dataset.i, card); else if (e.target.closest('#cue')) onCueTap(false); }
  else if (S.phase === 'explore') { if (card) onExploreTap(card); else onExploreBlank(); }
});
$('#screen-break').addEventListener('pointerdown', () => { if (S.phase === 'break' && S.breakStep) S.breakStep(); });
$('#done-parent').addEventListener('click', openPanel);

const gate = $('#gate'); let gateT = null;
gate.addEventListener('pointerdown', e => { e.preventDefault(); gateT = setTimeout(() => { gateT = null; openPanel(); }, 1500); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => gate.addEventListener(ev, () => { if (gateT) { clearTimeout(gateT); gateT = null; } }));

const KEYMAP = { 1: { ArrowDown: 0, ArrowLeft: 0, ArrowRight: 0, ArrowUp: 0 }, 2: { ArrowLeft: 0, ArrowRight: 1 },
                 3: { ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2 }, 4: { ArrowLeft: 0, ArrowUp: 1, ArrowDown: 2, ArrowRight: 3 } };
document.addEventListener('keydown', e => {
  const panelOpen = !$('#screen-parent').classList.contains('hidden');
  if (e.key === 'Escape') { if (!panelOpen) openPanel(); else if (S.running) resumeSession(); return; }
  if (panelOpen) { if (e.key === 'Enter' && e.target === document.body) { S.running ? resumeSession() : startSession(); } return; }
  const go = e.key === ' ' || e.key === 'Enter';
  if (S.phase === 'break') { if (go) { e.preventDefault(); if (S.breakStep) S.breakStep(); } return; }
  if (S.phase === 'done') { if (go) openPanel(); return; }
  if (!$('#celebrate').classList.contains('hidden')) { if (go) { e.preventDefault(); T.clear(S.celebT); hideCelebrate(); runTrial(); } return; }
  if (S.phase === 'trial' && S.trial && S.trial.mode === 'count') {
    if (go || /^Arrow/.test(e.key) || /^[0-9]$/.test(e.key)) { e.preventDefault(); SFX.init(); SFX.resume(); onPadTap(); }
    return;
  }
  if (go) { e.preventDefault(); if (S.phase === 'trial') onCueTap(false); return; }
  const cards = $$('#choices .card'), k = cards.length; if (!k) return;
  let idx = -1; const km = KEYMAP[k] || {};
  if (e.key in km) idx = km[e.key]; else if (/^[1-4]$/.test(e.key)) idx = +e.key - 1;
  if (idx < 0 || idx >= k) return;
  e.preventDefault(); SFX.init(); SFX.resume();
  if (trackTap()) return;
  if (S.phase === 'trial') onChoice(idx, cards[idx]); else if (S.phase === 'explore') onExploreTap(cards[idx]);
});
window.addEventListener('resize', relayout);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) openPanel(); });
document.addEventListener('touchmove', e => { if ($('#screen-parent').classList.contains('hidden')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---- boot ---- */
renderPanel(); show('parent'); setBg(null);
if (location.protocol === 'https:' && !/claude|anthropic/i.test(location.hostname)) {   // self-hosted: real offline install
  try {
    const m = document.createElement('link'); m.rel = 'manifest'; m.href = './manifest.webmanifest'; document.head.appendChild(m);
    const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = './apple-touch-icon.png'; document.head.appendChild(a);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  } catch (e) {}
}
window.TT = { S, CFG, settings, LEVELS, DOMAINS, ITEMS, ladder, dprog, levelCap, progress: () => progress, startSession, nextBlock, runTrial };
})();
</script>
</body>
