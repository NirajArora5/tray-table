# iOS. Two jobs:
#   simulator: compiles the shell for the iOS simulator on every push to main and every PR. Needs no secrets.
#   testflight: run it by hand (Actions > ios > Run workflow). Builds a signed archive with fastlane and uploads it to
#              TestFlight. Needs the secrets listed in README under "CI builds"; it stops with a clear message if any is missing.
name: ios
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run www && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -quiet build
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - name: Check the secrets are in place
        run: |
          missing=""
          for v in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 APPLE_TEAM_ID IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::add these repository secrets first (see README, CI builds):$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run www && npx cap sync ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App
      - run: bundle exec fastlane beta
        working-directory: ios/App
